backend:
  name: git-gateway
  branch: main

# Images are sitting at the root of the repo (alongside index.html),
# so the media library points there instead of a separate "images" folder.
media_folder: ""
public_folder: "/"

collections:
  - name: "media_only"
    label: "Site Images"
    files:
      - label: "Image Library"
        name: "images"
        file: "README.md"
        fields:
          - { label: "Notes", name: "body", widget: "markdown", required: false }
